name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Make scripts executable
        run: chmod +x gradlew scripts/build_transcribe_cpp_android.sh

      - name: Cache transcribe.cpp source
        uses: actions/cache@v4
        with:
          path: third_party/transcribe-cpp
          key: transcribe-cpp-v0.2.1
          restore-keys: |
            transcribe-cpp-v0.2.1-

      - name: Build native ASR libraries
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          TRANSCRIBE_REPO_REF: v0.2.1
        run: ./scripts/build_transcribe_cpp_android.sh

      - name: Run unit tests
        run: ./gradlew :core:nlp:test :core:scheduler:test :core:executor:test :data:local:testDebugUnitTest :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: release-artifacts

      - name: Get tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: VoiceConfig ${{ steps.tag.outputs.tag }}
          body: |
            VoiceConfig Release ${{ steps.tag.outputs.tag }}

            - Debug APK：适用于真机安装测试
            - Shizuku 官网：https://shizuku.rikka.app/
            - 大部分高级自动化能力需要 Shizuku 或无障碍服务
          files: release-artifacts/app-debug.apk
          draft: false
          prerelease: false
